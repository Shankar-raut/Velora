<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle with gradient -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" filter="url(#glow)"/>
  <!-- Inner circle for glass effect -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Velora "V" letter - elegant and minimal -->
  <path d="M42 38 L56 90 L70 90 L84 38 L76 38 L64 64 L52 38 Z" fill="white" opacity="0.95"/>
  <!-- Subtle highlight -->
  <path d="M44 42 L55 82 L73 82 L82 42" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>